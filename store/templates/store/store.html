

{% extends "./base.html" %}

{% load static %}



{% block content %}


    <!-- Introduction section -->
<style>
    body {
        background: linear-gradient(to right, #74ebd5, #ACB6E5);
        min-height: 100vh;
    }

    
    .card {
        height: 100%;
        border-radius: 12px;
        overflow: hidden;
    }

    
    .card img {
        width: 100%;
        height: 220px;           /* adjust based on how tall you want */
        object-fit: cover;       /* crops instead of stretching */
        border-bottom: 1px solid #ddd;
    }

    
    .card-body {
        min-height: 100px;       /* prevents smaller cards from shrinking */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

   
    .card:hover {
        transform: scale(1.02);
        transition: all 0.3s ease-in-out;
    }
</style>
  
    <section class="py-4 text-center container">

        <div class="row py-lg-5">
        
            <div class="col-lg-6 col-md-8 mx-auto">
                

                <h4 class="heading-josefin"> ShopShiv-Simplicity at it's finest. </h4>


                <br>
                

                <p class="lead text-muted">

                Browse our extensive collection.

                </p>


                <br>
        
                <a href="{%url 'register'%}" class="btn btn-primary my-2"> Create an account </a>
                
                
            </div>
        
        </div>

    
    </section>

   
   <!-- All products section -->
    
      
    <div class="album py-5 bg-primary text-white">
        
        <div class="container">
    
          <div class="pb-3 h5"> All products </div>


          <hr>

          <br>
          

          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-5 g-3">
    
            {% for product in my_products %}
    
            <div class="col">
              <div class="card shadow-sm">
                <img class="img-fluid" alt="Responsive image" src="{{ product.image.url }}">
                <div class="card-body">
                  <p class="card-text">
                    <a class="text-info text-decoration-none" href="{{product.get_absolute_url}}">{{product.title |capfirst}}</a>
                  </p>
                  <div class="d-flex justify-content-between align-items-center">
                    <h5> {{product.price}} </h5>
                  </div>
                </div>
              </div>
            
            </div>
    
            {% endfor %}
    
          </div>
        </div>
      </div>


{% endblock %}
