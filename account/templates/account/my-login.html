{% include "store/base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
    <style>
        body {
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            min-height: 100vh;
        }
    </style>

    <br><br><br>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="bg-white shadow-md p-5 rounded form-layout">

                    <h3 class="mb-3">Login to Your Account</h3>
                    <hr>

                    <form method="POST" autocomplete="off">
                        {% csrf_token %}
                        <br><br>
                        {{form.username|as_crispy_field}}
                        <br>
                        
                        {{form.password|as_crispy_field}}
                        <br>
                        
                        <!-- Forgot password link -->
                        <div class="text-end mb-3 text-center">
                            <a href="{% url 'reset_password' %}">Forgot your password?</a>
                        
                            <br> <br>
                            <a href="{% url 'register' %}">Don't have an account?</a>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
                    </form>

                </div>

            </div>
        </div>
    </div>
    <br><br><br>
{% endblock %}
