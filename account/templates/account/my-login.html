{% include "store/base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<style>
    body {
        background: linear-gradient(to right, #74ebd5, #ACB6E5);
        min-height: 100vh;
    }

    .page-center {
        min-height: calc(100vh - 72px); /* leaves space for navbar */
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 15px;
    }

    .form-layout {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        padding: 36px;
        max-width: 420px;
        width: 100%;
        transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .form-layout:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 36px rgba(0,0,0,0.12);
    }

    h3 {
        font-weight: 600;
        color: #2c3e50;
        text-align: center;
        margin-bottom: 10px;
    }

    hr {
        border: 0;
        border-top: 2px solid #e0e0e0;
        width: 60px;
        margin: 0 auto 24px auto;
    }

    a {
        color: #266ba7;
        text-decoration: none;
        font-weight: 500;
    }

    a:hover {
        text-decoration: underline;
    }

    .btn-primary {
        background: linear-gradient(135deg, #2b7fc7, #266ba7);
        border: none;
        border-radius: 30px;
        font-weight: 600;
        padding: 10px 0;
        box-shadow: 0 6px 18px rgba(38, 107, 167, 0.18);
        transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(38, 107, 167, 0.25);
    }

    label {
        font-weight: 500;
        color: #34495e;
    }

    input.form-control {
        border-radius: 10px !important;
    }

    .links {
        text-align: center;
        margin-top: 15px;
        color: #6c757d;
    }

    @media (max-width: 576px) {
        .form-layout {
            padding: 28px;
            border-radius: 12px;
        }
    }
</style>

<div class="page-center">
    <div class="form-layout">
        <h3>Login to Your Account</h3>
        <hr>

        <form method="POST" autocomplete="off">
            {% csrf_token %}
            {{ form.username|as_crispy_field }}
            {{ form.password|as_crispy_field }}

            <div class="links">
                <a href="{% url 'reset_password' %}">Forgot your password?</a>
                <br>
                <a href="{% url 'register' %}">Don't have an account?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4">Login</button>
        </form>
    </div>
</div>
{% endblock %}
