{% include "store/base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<style>
    body {
        background: linear-gradient(to right, #74ebd5, #ACB6E5);
        min-height: 100vh;
    }
</style>

<br><br><br>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="bg-white shadow-md p-5 rounded form-layout">

                <h3 class="mb-3">Update Your Account</h3>
                <hr>
                

                <form method="POST" autocomplete="off">
                    {% csrf_token %}
                    <br><br>
                    {{ user_form.username|as_crispy_field }}
                    <br><br>
                    {{ user_form.email|as_crispy_field }}
                    <br><br>
                    <button type="submit" class="btn btn-primary w-100 mt-3">
                        Update Your Account
                    </button>
                </form>

                <!-- Delete Account Button -->
                <form method="POST" action="{% url 'delete-account' %}"  class="mt-3">
                    {% csrf_token %}
                    <!-- Delete Account Button -->
                    <a href="{% url 'delete-account' %}" class="btn btn-danger w-100 mt-3">
                        Delete Account
                    </a>

                </form>

            </div>

        </div>
    </div>
</div>

<br><br><br>
{% endblock %}
